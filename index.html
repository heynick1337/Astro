<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glober — Global Chat</title>
  <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="moreFiles/style.css">
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-bg">
      <div class="login-orb orb1"></div>
      <div class="login-orb orb2"></div>
      <div class="login-orb orb3"></div>
    </div>
    <div class="login-card" id="loginCard">
      <div class="login-logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="18" stroke="var(--accent)" stroke-width="2"/>
          <path d="M12 20 Q20 8 28 20 Q20 32 12 20Z" fill="var(--accent)" opacity="0.9"/>
          <circle cx="20" cy="20" r="4" fill="var(--bg-primary)"/>
        </svg>
        <span class="login-brand">glober</span>
      </div>
      <h1 class="login-title">Talk to the world.</h1>
      <p class="login-sub">No accounts. No profiles. Just your name.</p>

      <div class="login-form">
        <div class="input-wrap" id="inputWrap">
          <input
            type="text"
            id="usernameInput"
            class="login-input"
            placeholder="Pick a username…"
            maxlength="16"
            autocomplete="off"
            spellcheck="false"
          />
          <span class="char-count" id="charCount">0/16</span>
        </div>
        <p class="input-hint" id="inputHint">3–16 characters, letters, numbers, _ or -</p>
        <button class="login-btn" id="loginBtn" disabled>
          <span>Enter Chat</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>

      <div class="theme-bar">
        <span class="theme-label">Theme</span>
        <div class="theme-pills">
          <button class="theme-pill active" data-theme="midnight" title="Midnight">🌑</button>
          <button class="theme-pill" data-theme="aurora" title="Aurora">🌌</button>
          <button class="theme-pill" data-theme="rose" title="Rose">🌸</button>
          <button class="theme-pill" data-theme="forest" title="Forest">🌿</button>
          <button class="theme-pill" data-theme="light" title="Light">☀️</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div class="chat-screen hidden" id="chatScreen">

    <!-- SIDEBAR (online users) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Online</span>
        <span class="online-count" id="onlineCount">0</span>
      </div>
      <ul class="user-list" id="userList"></ul>
    </aside>

    <div class="chat-main">
      <!-- TOPBAR -->
      <header class="topbar">
        <button class="sidebar-toggle" id="sidebarToggle" title="Online users">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><path d="M16 3.13a4 4 0 010 7.75"/><path d="M21 21v-2a4 4 0 00-3-3.87"/></svg>
        </button>
        <div class="topbar-center">
          <div class="room-dot"></div>
          <span class="room-name">Global Room</span>
        </div>
        <div class="topbar-actions">
          <div class="theme-toggle-wrap">
            <button class="icon-btn" id="themeToggleBtn" title="Change theme">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            </button>
            <div class="theme-dropdown hidden" id="themeDropdown">
              <button class="theme-opt" data-theme="midnight">🌑 Midnight</button>
              <button class="theme-opt" data-theme="aurora">🌌 Aurora</button>
              <button class="theme-opt" data-theme="rose">🌸 Rose</button>
              <button class="theme-opt" data-theme="forest">🌿 Forest</button>
              <button class="theme-opt" data-theme="light">☀️ Light</button>
            </div>
          </div>
          <button class="icon-btn" id="leaveBtn" title="Leave chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          </button>
        </div>
      </header>

      <!-- MESSAGES -->
      <div class="messages" id="messages">
        <div class="messages-spacer"></div>
      </div>

      <!-- TYPING INDICATOR -->
      <div class="typing-bar" id="typingBar">
        <span id="typingText"></span>
      </div>

      <!-- REPLY PREVIEW -->
      <div class="reply-preview hidden" id="replyPreview">
        <div class="reply-preview-inner">
          <div>
            <span class="reply-to-user" id="replyToUser"></span>
            <p class="reply-to-msg" id="replyToMsg"></p>
          </div>
          <button class="close-reply" id="closeReply">✕</button>
        </div>
      </div>

      <!-- INPUT BAR -->
      <div class="input-bar">
        <div class="input-inner">
          <div
            class="msg-input"
            id="msgInput"
            contenteditable="true"
            data-placeholder="Message everyone…"
          ></div>
          <button class="send-btn" id="sendBtn" title="Send">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2L15 22 11 13 2 9l20-7z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="moreFiles/script.js" type="module"></script>
</body>
</html>
